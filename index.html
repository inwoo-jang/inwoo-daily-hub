<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 이름표에만 쓰는 글꼴. 라틴만 받아 오므로 가볍다 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    >

    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <!-- 고해상도 탭·바로가기용. 흰 로고는 흰 탭에서 안 보여 초록 판 위에 얹었다 -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256">
    <link rel="apple-touch-icon" href="/favicon.png">

    <!--
      Pretendard — 본문·제목에 쓰는 한글 글꼴.
      main.css 의 --font-sans 가 이 이름을 첫 번째로 부르는데 지금까지 불러오지
      않아 시스템 기본으로 떨어져 있었다. dynamic-subset 은 화면에 실제로 쓰인
      글자만 내려받으므로 한글 전체(수 MB)를 받지 않는다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Hub - by INWOO</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
